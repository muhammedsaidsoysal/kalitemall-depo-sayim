          '''
          validators = '    fun isValidSku(value: String): Boolean = skuRe.matches(normalize(value))\n' + \
                       '    fun isValidSize(value: String): Boolean = sizeRe.matches(normalize(value))\n\n'
          code = change_once(code, anchor, validators + anchor, 'validators')
          scan.write_text(code, encoding='utf-8')

          ui = main.read_text(encoding='utf-8')
          old_validation = '''        val skuPattern=Regex("[0-9]{2,3}(?:-[A-Z0-9]+)+-[RKB][0-9]{2}")
                  val sizePattern=Regex("STD|SM|ML|LXL|XS|S|M|L|XL|XXL|XXXL|3XL|4XL|[0-9]{2}")
                  if(!skuPattern.matches(sku) || !sizePattern.matches(size)) {'''
          old_validation = ('        val skuPattern=Regex("[0-9]{2,3}(?:-[A-Z0-9]+)+-[RKB][0-9]{2}")\n'
                            '        val sizePattern=Regex("STD|SM|ML|LXL|XS|S|M|L|XL|XXL|XXXL|3XL|4XL|[0-9]{2}")\n'
                            '        if(!skuPattern.matches(sku) || !sizePattern.matches(size)) {')
          ui = change_once(ui, old_validation, '        if(!ScanRules.isValidSku(sku) || !ScanRules.isValidSize(size)) {', 'manual validation')
          main.write_text(ui, encoding='utf-8')

          config = gradle.read_text(encoding='utf-8')
          for old, new in (
              ('versionCode = 9', 'versionCode = 10'),
              ('versionName = "1.9-alphanumeric-sku"', 'versionName = "1.10-compound-size"'),
              ('applicationIdSuffix = ".serialv19"', 'applicationIdSuffix = ".serialv110"'),
          ):
              config = change_once(config, old, new, 'Gradle ' + old)
          gradle.write_text(config, encoding='utf-8')
          xml = manifest.read_text(encoding='utf-8')
          xml = change_once(xml, 'android:label="KaliteMall v1.9 TEST"', 'android:label="KaliteMall v1.10 TEST"', 'app label')
          manifest.write_text(xml, encoding='utf-8')

          test_code = tests.read_text(encoding='utf-8')
          new_test = '''
              @Test fun compoundSizesAndExtendedCodes() {
                  val samples = listOf("3840", "4042", "4244", "XLXXL", "STD", "SM", "ML", "LXL", "40")
                  for (size in samples) {
                      assertTrue("Size not valid: $size", ScanRules.isValidSize(size))
                      assertEquals(size, ScanRules.sizeFromRegion(listOf(OcrLine(size, .95f, .5f, .5f, 0))))
                  }
                  val codes = listOf("T0165-581998-R01", "186-033Y-R15", "302-ES-030-R01")
                  for (sku in codes) {
                      assertTrue("SKU not valid: $sku", ScanRules.isValidSku(sku))
                      assertEquals(sku, ScanRules.codeFromRegion(listOf(OcrLine(sku, .95f, .5f, .5f, 0))))
                  }
                  assertFalse(ScanRules.isValidSize("38/40"))
                  assertEquals("40", ScanRules.sizeFromRegion(listOf(OcrLine("40", .95f, .5f, .5f, 0))))
                  assertFalse(ScanRules.isValidSku("205-4519-R011"))
              }
          '''
          # Append test inside the existing JUnit class.
          if not test_code.rstrip().endswith('}'):
              raise SystemExit('Unexpected tests layout')
          test_code = test_code.rstrip()[:-1] + new_test + '\n}\n'
          tests.write_text(test_code, encoding='utf-8')
          print('v1.10 modifications applied in runner. Repository source is NOT overwritten.')
          PY

      - name: Test and build isolated v1.10 APK
        working-directory: android-app
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Downloadable v1.10 test APK
        uses: actions/upload-artifact@v4
        with:
          name: KaliteMall-v1-10-Birlesik-Beden-TEST-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
